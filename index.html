<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cool Password Checker</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

.container {
    width: 320px;
    padding: 25px;
    border-radius: 15px;
    backdrop-filter: blur(15px);
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    color: white;
}

h2 {
    text-align: center;
    margin-bottom: 15px;
}

.input-box {
    position: relative;
}

input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    outline: none;
    font-size: 16px;
}

.toggle {
    position: absolute;
    right: 10px;
    top: 10px;
    cursor: pointer;
    color: #555;
}

.strength-bar {
    height: 8px;
    border-radius: 10px;
    margin-top: 12px;
    background: #ddd;
    overflow: hidden;
}

.bar {
    height: 100%;
    width: 0%;
    transition: 0.4s;
}

.text {
    margin-top: 8px;
    font-weight: bold;
}

/* Colors */
.weak { background: red; }
.medium { background: orange; }
.strong { background: limegreen; }

</style>
</head>
<body>

<div class="container">
    <h2>Password Checker</h2>

    <div class="input-box">
        <input type="password" id="password" placeholder="Enter password">
        <span class="toggle" onclick="togglePassword()">👁️</span>
    </div>

    <div class="strength-bar">
        <div id="bar" class="bar"></div>
    </div>

    <div id="text" class="text"></div>
</div>

<script>
const password = document.getElementById("password");
const bar = document.getElementById("bar");
const text = document.getElementById("text");

password.addEventListener("input", () => {
    let val = password.value;
    let strength = 0;

    if (val.length >= 6) strength++;
    if (val.match(/[a-z]/) && val.match(/[A-Z]/)) strength++;
    if (val.match(/[0-9]/)) strength++;
    if (val.match(/[^a-zA-Z0-9]/)) strength++;

    if (strength <= 1) {
        bar.style.width = "25%";
        bar.className = "bar weak";
        text.textContent = "Weak 😢";
    } 
    else if (strength == 2 || strength == 3) {
        bar.style.width = "60%";
        bar.className = "bar medium";
        text.textContent = "Medium 🙂";
    } 
    else {
        bar.style.width = "100%";
        bar.className = "bar strong";
        text.textContent = "Strong 💪";
    }
});

function togglePassword() {
    password.type = password.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
